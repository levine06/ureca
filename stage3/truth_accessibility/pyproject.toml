[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "accessfold"
version = "0.1.0"
description = "Stage 3 experimental and candidate accessibility scoring"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
biotite = ["biotite>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
accessfold = ["data/references/*.json"]
