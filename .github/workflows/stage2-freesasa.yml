name: Stage 2 FreeSASA checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freesasa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stage2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Install package and FreeSASA
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install 'freesasa==2.2.1' --use-pep517 --no-cache-dir
          python -c "import freesasa; print(freesasa.__file__)"
          python -m pip freeze > freesasa-environment.txt
      - name: Run four optional checks
        run: python -m pytest tests/test_physical_sanity.py -k freesasa -v -rs --junitxml=freesasa-results.xml
      - name: Confirm four tests passed without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('freesasa-results.xml').findall('.//testcase')
          assert len(cases) == 4, f'Expected 4 tests, found {len(cases)}'
          assert all(case.find('skipped') is None and case.find('failure') is None and case.find('error') is None for case in cases)
          print('All four FreeSASA checks passed without skips')
          PY
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-freesasa-evidence
          path: |
            stage2/freesasa-results.xml
            stage2/freesasa-environment.txt
          if-no-files-found: warn
